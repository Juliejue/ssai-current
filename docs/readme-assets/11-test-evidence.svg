<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">测试证据卡</title>
  <desc id="desc">后端、前端与总测试数量，以及自动化测试的覆盖边界。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#102F33" flood-opacity=".10"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102F33" flood-opacity=".08"/></filter>
    <linearGradient id="paperGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAFCFB"/><stop offset=".55" stop-color="#F3F6F4"/><stop offset="1" stop-color="#E6F0ED"/></linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174F53"/><stop offset="1" stop-color="#1E777A"/></linearGradient>
    <style>
      text { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
      .title, .subtitle, .body, .small, .tiny, .label, .cardTitle { fill: #102F33; }
      .muted { fill: #60777A; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 3px; fill: #1E6E72; }
      .title { font-size: 66px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 30px; font-weight: 600; }
      .body { font-size: 24px; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .cardTitle { font-size: 27px; font-weight: 800; }
    </style>
  </defs><rect x="0" y="0" width="1600" height="900" rx="0" fill="url(#paperGlow)" stroke="none" /><text x="70" y="72" class="eyebrow" text-anchor="start" >11 · VERIFICATION EVIDENCE</text><text x="70" y="145" class="title" text-anchor="start" >提交前，不靠“应该可以”</text><text x="72" y="195" class="body" text-anchor="start" >以自动化测试保护推荐、安全、语音降级、地图与跨设备逻辑。</text><rect x="70" y="275" width="420" height="250" rx="38" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#shadow)"/><text x="280" y="410" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="102" font-weight="850" text-anchor="middle" fill="#1E6E72">208</text><text x="280" y="470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#102F33">后端测试通过</text><rect x="540" y="275" width="420" height="250" rx="38" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#shadow)"/><text x="750" y="410" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="102" font-weight="850" text-anchor="middle" fill="#1E6E72">67</text><text x="750" y="470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#102F33">前端策略测试通过</text><rect x="1010" y="275" width="420" height="250" rx="38" fill="#102F33" stroke="none" filter="url(#shadow)"/><text x="1220" y="410" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="102" font-weight="850" text-anchor="middle" fill="#fff">275</text><text x="1220" y="470" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#DDECE9">总计通过</text><rect x="70" y="585" width="880" height="230" rx="34" fill="#FFFFFF" stroke="#CEDAD8" /><text x="108" y="635" class="cardTitle" text-anchor="start" >覆盖范围</text><rect x="108" y="674" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="197" y="705" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">安全分流</text><rect x="304" y="674" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="393" y="705" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">确定性排序</text><rect x="500" y="674" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="589" y="705" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">地图与地理编码</text><rect x="696" y="674" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="785" y="705" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">反馈画像</text><rect x="108" y="736" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="197" y="767" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">语音降级</text><rect x="304" y="736" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="393" y="767" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">跨设备接续</text><rect x="500" y="736" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="589" y="767" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">共创审核</text><rect x="696" y="736" width="178" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="785" y="767" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">缓存与重试</text><rect x="990" y="585" width="540" height="230" rx="34" fill="#F4D8C5" stroke="none" /><text x="1030" y="635" class="cardTitle" text-anchor="start" >最后验证</text><text x="1030" y="683" class="body" text-anchor="start" >2026-10-04 · commit 0202863</text><text x="1030" y="730" class="small" text-anchor="start" ><tspan x="1030" dy="0">自动化不替代真机语音、定位与</tspan><tspan x="1030" dy="32">国内移动网络访问验证。</tspan></text></svg>
