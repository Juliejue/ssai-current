<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="360" viewBox="0 0 1500 360" role="img" aria-labelledby="title desc">
  <title id="title">推荐流程</title>
  <desc id="desc">表达经过结构化理解、地图候选和规则排序，最后回到用户选择。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#102F33" flood-opacity=".10"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102F33" flood-opacity=".08"/></filter>
    <linearGradient id="paperGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAFCFB"/><stop offset=".55" stop-color="#F3F6F4"/><stop offset="1" stop-color="#E6F0ED"/></linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174F53"/><stop offset="1" stop-color="#1E777A"/></linearGradient>
    <style>
      text { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
      .title, .subtitle, .body, .small, .tiny, .label, .cardTitle { fill: #102F33; }
      .muted { fill: #60777A; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 3px; fill: #1E6E72; }
      .title { font-size: 66px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 30px; font-weight: 600; }
      .body { font-size: 24px; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .cardTitle { font-size: 27px; font-weight: 800; }
    </style>
  </defs><rect x="0" y="0" width="1500" height="360" rx="0" fill="#F3F6F4" stroke="none" /><rect x="54" y="82" width="238" height="156" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="88" cy="116" r="8" fill="#1E6E72"/><text x="173" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="760" text-anchor="middle" fill="#102F33">此刻的表达</text><text x="173" y="199" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" fill="#60777A">用户</text><path d="M294 160 H326" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M316 150 L328 160 L316 170" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="346" y="82" width="238" height="156" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="380" cy="116" r="8" fill="#C4703C"/><text x="465" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="760" text-anchor="middle" fill="#102F33">NeedState</text><text x="465" y="199" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" fill="#60777A">模型</text><path d="M586 160 H618" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M608 150 L620 160 L608 170" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="638" y="82" width="238" height="156" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="672" cy="116" r="8" fill="#1E6E72"/><text x="757" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="760" text-anchor="middle" fill="#102F33">真实 POI</text><text x="757" y="199" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" fill="#60777A">地图</text><path d="M878 160 H910" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M900 150 L912 160 L900 170" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="930" y="82" width="238" height="156" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="964" cy="116" r="8" fill="#1E6E72"/><text x="1049" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="760" text-anchor="middle" fill="#102F33">过滤与排序</text><text x="1049" y="199" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" fill="#60777A">规则</text><path d="M1170 160 H1202" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M1192 150 L1204 160 L1192 170" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1222" y="82" width="238" height="156" rx="28" fill="#102F33" stroke="none" filter="url(#softShadow)"/><circle cx="1256" cy="116" r="8" fill="#1E6E72"/><text x="1341" y="158" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="760" text-anchor="middle" fill="#fff">1 + 2 个选择</text><text x="1341" y="199" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" text-anchor="middle" fill="#DDECE9">用户</text><text x="750" y="302" class="small" text-anchor="middle" >地点由地图提供，最终选择属于用户</text></svg>
