  </defs><rect x="0" y="0" width="1800" height="760" rx="0" fill="url(#paperGlow)" stroke="none" /><text x="70" y="72" class="eyebrow" text-anchor="start" >03 · USER JOURNEY</text><text x="70" y="148" class="title" text-anchor="start" >从一句感受，到一次真实行动</text><text x="72" y="198" class="body" text-anchor="start" >闭环不是“给建议”，而是让每一次到访都成为下一次推荐的证据。</text><rect x="54" y="268" width="310" height="365" rx="34" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="102" cy="316" r="28" fill="#102F33"/><text x="102" y="324" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text><rect x="196" y="296" width="142" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="267" y="327" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">用户</text><text x="209" y="438" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="74" font-weight="800" text-anchor="middle" fill="#1E6E72">“…”</text><text x="209" y="506" class="cardTitle" text-anchor="middle" >表达此刻状态</text><text x="209" y="554" class="small" text-anchor="middle" >自然语言或快速选择</text><path d="M366 452 H384" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M374 442 L386 452 L374 462" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="402" y="268" width="310" height="365" rx="34" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="450" cy="316" r="28" fill="#102F33"/><text x="450" y="324" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text><rect x="544" y="296" width="142" heigh