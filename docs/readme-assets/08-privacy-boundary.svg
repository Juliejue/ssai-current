<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">隐私数据边界</title>
  <desc id="desc">设备内数据、结构化上传数据与达到门槛后可公开数据的边界。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#102F33" flood-opacity=".10"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102F33" flood-opacity=".08"/></filter>
    <linearGradient id="paperGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAFCFB"/><stop offset=".55" stop-color="#F3F6F4"/><stop offset="1" stop-color="#E6F0ED"/></linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174F53"/><stop offset="1" stop-color="#1E777A"/></linearGradient>
    <style>
      text { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
      .title, .subtitle, .body, .small, .tiny, .label, .cardTitle { fill: #102F33; }
      .muted { fill: #60777A; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 3px; fill: #1E6E72; }
      .title { font-size: 66px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 30px; font-weight: 600; }
      .body { font-size: 24px; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .cardTitle { font-size: 27px; font-weight: 800; }
    </style>
  </defs><rect x="0" y="0" width="1600" height="980" rx="0" fill="url(#paperGlow)" stroke="none" /><text x="70" y="72" class="eyebrow" text-anchor="start" >08 · PRIVACY BOUNDARY</text><text x="70" y="145" class="title" text-anchor="start" >让系统更懂你，不等于让所有数据离开设备</text><text x="72" y="195" class="body" text-anchor="start" >只传递完成推荐闭环所需的最少结构化信息。</text><rect x="110" y="270" width="1380" height="610" rx="50" fill="#FFFFFFCC" stroke="#CEDAD8" filter="url(#shadow)"/><rect x="170" y="330" width="1260" height="490" rx="44" fill="#DDECE9" stroke="#8FC3C0" /><rect x="250" y="410" width="1100" height="330" rx="40" fill="#102F33" stroke="none" /><text x="150" y="314" class="cardTitle" text-anchor="start" >达到门槛后可公开</text><text x="210" y="374" class="cardTitle" text-anchor="start" >可以结构化上传</text><text x="290" y="458" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="28" font-weight="800" fill="#fff">只在设备上</text><rect x="290" y="502" width="270" height="48" rx="24" fill="#27484C" stroke="none" /><text x="425" y="533" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">原始语音</text><rect x="600" y="502" width="270" height="48" rx="24" fill="#27484C" stroke="none" /><text x="735" y="533" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">倾诉原文</text><rect x="910" y="502" width="270" height="48" rx="24" fill="#27484C" stroke="none" /><text x="1045" y="533" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">实时坐标</text><rect x="290" y="578" width="270" height="48" rx="24" fill="#27484C" stroke="none" /><text x="425" y="609" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">私密笔记</text><rect x="600" y="578" width="270" height="48" rx="24" fill="#27484C" stroke="none" /><text x="735" y="609" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#fff">照片与媒体</text><text x="290" y="696" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="19" fill="#DDECE9">默认不上传，不用于公开训练，不跨设备同步。</text><rect x="270" y="760" width="190" height="48" rx="24" fill="#FFFFFF" stroke="none" /><text x="365" y="791" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">需求状态</text><rect x="488" y="760" width="190" height="48" rx="24" fill="#FFFFFF" stroke="none" /><text x="583" y="791" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">推荐选择</text><rect x="706" y="760" width="190" height="48" rx="24" fill="#FFFFFF" stroke="none" /><text x="801" y="791" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">围栏结论</text><rect x="924" y="760" width="190" height="48" rx="24" fill="#FFFFFF" stroke="none" /><text x="1019" y="791" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">停留分钟</text><rect x="1142" y="760" width="190" height="48" rx="24" fill="#FFFFFF" stroke="none" /><text x="1237" y="791" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">反馈因素</text><text x="246" y="855" class="body" text-anchor="start" >经审核共创 · 匿名空间画像 · 最小样本量后的公共信号</text><rect x="1060" y="250" width="430" height="118" rx="30" fill="#F4D8C5" stroke="none" filter="url(#softShadow)"/><text x="1092" y="295" class="label" text-anchor="start" >三条执行原则</text><text x="1092" y="330" class="small" text-anchor="start" ><tspan x="1092" dy="0">围栏在浏览器计算 · 服务端证据只降不升 · 私密记录可删除</tspan></text></svg>
