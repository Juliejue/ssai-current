<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">Agent 工作流</title>
  <desc id="desc">模型、规则、地图、用户与数据库在推荐闭环中的责任边界。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#102F33" flood-opacity=".10"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102F33" flood-opacity=".08"/></filter>
    <linearGradient id="paperGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAFCFB"/><stop offset=".55" stop-color="#F3F6F4"/><stop offset="1" stop-color="#E6F0ED"/></linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174F53"/><stop offset="1" stop-color="#1E777A"/></linearGradient>
    <style>
      text { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
      .title, .subtitle, .body, .small, .tiny, .label, .cardTitle { fill: #102F33; }
      .muted { fill: #60777A; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 3px; fill: #1E6E72; }
      .title { font-size: 66px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 30px; font-weight: 600; }
      .body { font-size: 24px; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .cardTitle { font-size: 27px; font-weight: 800; }
    </style>
  </defs><rect x="0" y="0" width="1800" height="980" rx="0" fill="url(#paperGlow)" stroke="none" /><text x="70" y="72" class="eyebrow" text-anchor="start" >05 · AGENT WORKFLOW</text><text x="70" y="145" class="title" text-anchor="start" >小在如何把“我不知道去哪”变成一次行动</text><text x="72" y="196" class="body" text-anchor="start" >模型负责理解与表达；规则守住边界；地图提供现实；用户始终拥有决定权。</text><rect x="70" y="270" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="108" cy="308" r="20" fill="#447B60"/><text x="108" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="336" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#447B60" text-anchor="end">用户</text><text x="96" y="374" class="cardTitle" text-anchor="start" >表达</text><text x="96" y="421" class="small" text-anchor="start" >原话 / 快速选择</text><path d="M364 372 H394" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M384 362 L396 372 L384 382" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="270" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="452" cy="308" r="20" fill="#C4703C"/><text x="452" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="680" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#C4703C" text-anchor="end">规则</text><text x="440" y="374" class="cardTitle" text-anchor="start" >安全判断</text><text x="440" y="421" class="small" text-anchor="start" >危机信号先分流</text><path d="M708 372 H738" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M728 362 L740 372 L728 382" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="758" y="270" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="796" cy="308" r="20" fill="#1E6E72"/><text x="796" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="1024" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#1E6E72" text-anchor="end">模型</text><text x="784" y="374" class="cardTitle" text-anchor="start" >结构化理解</text><text x="784" y="421" class="small" text-anchor="start" >NeedState</text><path d="M1052 372 H1082" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M1072 362 L1084 372 L1072 382" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1102" y="270" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="1140" cy="308" r="20" fill="#376B9A"/><text x="1140" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="1368" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#376B9A" text-anchor="end">地图</text><text x="1128" y="374" class="cardTitle" text-anchor="start" >地图候选</text><text x="1128" y="421" class="small" text-anchor="start" >POI / 路线 / 营业</text><path d="M1396 372 H1426" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M1416 362 L1428 372 L1416 382" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1446" y="270" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="1484" cy="308" r="20" fill="#C4703C"/><text x="1484" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="1712" y="315" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#C4703C" text-anchor="end">规则</text><text x="1472" y="374" class="cardTitle" text-anchor="start" >过滤与排序</text><text x="1472" y="421" class="small" text-anchor="start" >硬条件 + 确定性评分</text><rect x="70" y="556" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="108" cy="594" r="20" fill="#1E6E72"/><text x="108" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="336" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#1E6E72" text-anchor="end">模型</text><text x="96" y="660" class="cardTitle" text-anchor="start" >解释推荐</text><text x="96" y="707" class="small" text-anchor="start" >为什么适合此刻</text><path d="M364 658 H394" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M384 648 L396 658 L384 668" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="414" y="556" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="452" cy="594" r="20" fill="#447B60"/><text x="452" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">7</text><text x="680" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#447B60" text-anchor="end">用户</text><text x="440" y="660" class="cardTitle" text-anchor="start" >用户纠错</text><text x="440" y="707" class="small" text-anchor="start" >安静一点 / 近一点</text><path d="M708 658 H738" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M728 648 L740 658 L728 668" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="758" y="556" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="796" cy="594" r="20" fill="#376B9A"/><text x="796" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">8</text><text x="1024" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#376B9A" text-anchor="end">地图</text><text x="784" y="660" class="cardTitle" text-anchor="start" >地图行动</text><text x="784" y="707" class="small" text-anchor="start" >路线与出发</text><path d="M1052 658 H1082" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M1072 648 L1084 658 L1072 668" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1102" y="556" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="1140" cy="594" r="20" fill="#447B60"/><text x="1140" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">9</text><text x="1368" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#447B60" text-anchor="end">用户</text><text x="1128" y="660" class="cardTitle" text-anchor="start" >到访反馈</text><text x="1128" y="707" class="small" text-anchor="start" >状态变化与因素</text><path d="M1396 658 H1426" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M1416 648 L1428 658 L1416 668" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1446" y="556" width="292" height="204" rx="30" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="1484" cy="594" r="20" fill="#725F9A"/><text x="1484" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#fff" text-anchor="middle">10</text><text x="1712" y="601" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="16" font-weight="800" fill="#725F9A" text-anchor="end">数据库</text><text x="1472" y="660" class="cardTitle" text-anchor="start" >空间画像</text><text x="1472" y="707" class="small" text-anchor="start" >达标后保守更新</text><path d="M1638 474 C1690 474 1690 555 1638 555" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><rect x="70" y="858" width="1660" height="72" rx="24" fill="#102F33" stroke="none" /><text x="110" y="904" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#fff">底线：</text><text x="210" y="904" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="21" fill="#DDECE9">高风险表达不进入地点推荐；模型不能虚构地点；地图与用户反馈可以否决模型。</text></svg>
