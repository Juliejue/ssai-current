  </defs><rect x="0" y="0" width="1800" height="1080" rx="0" fill="url(#paperGlow)" stroke="none" /><text x="70" y="72" class="eyebrow" text-anchor="start" >06 · SYSTEM ARCHITECTURE</text><text x="70" y="145" class="title" text-anchor="start" >当前可运行系统，以及清楚的降级边界</text><text x="72" y="195" class="body" text-anchor="start" >PWA 前端 + FastAPI 后端 + 可替换服务提供方；任何单点失败都应回到可操作状态。</text><rect x="50" y="250" width="1700" height="150" rx="34" fill="#FFFFFFCC" stroke="#CEDAD8" filter="url(#softShadow)"/><rect x="50" y="250" width="190" height="150" rx="34" fill="#1E6E72"/><text x="145" y="333" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle">体验层</text><rect x="50" y="430" width="1700" height="210" rx="34" fill="#FFFFFFCC" stroke="#CEDAD8" filter="url(#softShadow)"/><rect x="50" y="430" width="190" height="210" rx="34" fill="#102F33"/><text x="145" y="543" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle">服务层</text><rect x="50" y="670" width="1700" height="160" rx="34" fill="#FFFFFFCC" stroke="#CEDAD8" filter="url(#softShadow)"/><rect x="50" y="670" width="190" height="160" rx="34" fill="#C4703C"/><text x="145" y="758" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle">能力层</text><rect x="50" y="860" width="1700" height="150" rx="34" fill="#FFFFFFCC" stroke="#CEDAD8" filter="url(#softShadow)"/><rect x="50" y="860" width="190" height="150" rx="34" fill="#447B60"/><text x="145" y="943" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="800" fill="#fff" text-anchor="middle">数据层</text><rect x="270" y="278" width="250" height="94" rx="2