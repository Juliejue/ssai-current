      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .cardTitle { font-size: 27px; font-weight: 800; }
    </style>
  </defs><rect x="0" y="0" width="1800" height="1000" rx="0" fill="url(#paperGlow)" stroke="none" /><text x="70" y="72" class="eyebrow" text-anchor="start" >10 · ROADMAP</text><text x="70" y="145" class="title" text-anchor="start" >工程 × 产品 × 验证：知道什么已经完成，也知道下一步为何重要</text><text x="72" y="195" class="body" text-anchor="start" >路线图中的未来能力不会被写成当前能力。</text><rect x="56" y="260" width="400" height="640" rx="38" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><rect x="56" y="260" width="400" height="112" rx="38" fill="#1E6E72"/><rect x="56" y="330" width="400" height="42" fill="#1E6E72"/><text x="90" y="310" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff">现在</text><text x="90" y="350" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" fill="#fff" opacity=".84">可运行闭环</text><circle cx="104" cy="426" r="16" fill="#1E6E72" opacity="1"/><path d="M97 426 l5 6 10 -13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="434" class="body" text-anchor="start" >推荐与反馈闭环</text><circle cx="104" cy="534" r="16" fill="#1E6E72" opacity="0.88"/><path d="M97 534 l5 6 10 -13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="542" class="body" text-anchor="start" >北京 / 深圳地图候选</text><circle cx="104" cy="642" r="16" fill="#1E6E72" opacity="0.76"/><path d="M97 642 l5 6 10 -13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="650" class="body" text-anchor="start" >跨设备网页伴侣</text><circle cx="104" cy="750" r="16" fill="#1E6E72" opacity="0.64"/><path d="M97 750 l5 6 10 -13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="758" class="body" text-anchor="start" >安全与隐私边界</text><path d="M456 58