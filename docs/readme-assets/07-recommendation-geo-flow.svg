<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="980" viewBox="0 0 1800 980" role="img" aria-labelledby="title desc">
  <title id="title">推荐与地理数据流</title>
  <desc id="desc">从用户原话到地图候选、确定性评分、到访证据和空间画像。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#102F33" flood-opacity=".10"/></filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#102F33" flood-opacity=".08"/></filter>
    <linearGradient id="paperGlow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FAFCFB"/><stop offset=".55" stop-color="#F3F6F4"/><stop offset="1" stop-color="#E6F0ED"/></linearGradient>
    <linearGradient id="tealGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#174F53"/><stop offset="1" stop-color="#1E777A"/></linearGradient>
    <style>
      text { font-family: -apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
      .title, .subtitle, .body, .small, .tiny, .label, .cardTitle { fill: #102F33; }
      .muted { fill: #60777A; }
      .eyebrow { font-size: 22px; font-weight: 700; letter-spacing: 3px; fill: #1E6E72; }
      .title { font-size: 66px; font-weight: 800; letter-spacing: -2px; }
      .subtitle { font-size: 30px; font-weight: 600; }
      .body { font-size: 24px; }
      .small { font-size: 18px; }
      .tiny { font-size: 15px; }
      .label { font-size: 18px; font-weight: 700; }
      .cardTitle { font-size: 27px; font-weight: 800; }
    </style>
  </defs><rect x="0" y="0" width="1800" height="980" rx="0" fill="url(#paperGlow)" stroke="none" /><text x="70" y="72" class="eyebrow" text-anchor="start" >07 · RECOMMENDATION &amp; GEO DATA</text><text x="70" y="145" class="title" text-anchor="start" >推荐不是一句模型答案，而是一条可审计的数据链</text><text x="72" y="195" class="body" text-anchor="start" >先把不可去的地方排除，再在真实候选里解释为什么适合“此刻”。</text><rect x="70" y="280" width="230" height="160" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="110" cy="322" r="28" fill="#102F33"/><text x="110" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">1</text><text x="94" y="384" class="cardTitle" text-anchor="start" >用户原话</text><text x="94" y="418" class="small" text-anchor="start" >自然语言</text><path d="M300 360 H312" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M302 350 L314 360 L302 370" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="330" y="280" width="230" height="160" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="370" cy="322" r="28" fill="#102F33"/><text x="370" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">2</text><text x="354" y="384" class="cardTitle" text-anchor="start" >NeedState</text><text x="354" y="418" class="small" text-anchor="start" >需求与能量</text><path d="M560 360 H572" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M562 350 L574 360 L562 370" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="590" y="280" width="230" height="160" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="630" cy="322" r="28" fill="#102F33"/><text x="630" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">3</text><text x="614" y="384" class="cardTitle" text-anchor="start" >地图候选</text><text x="614" y="418" class="small" text-anchor="start" >POI / 路线</text><path d="M820 360 H832" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M822 350 L834 360 L822 370" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="850" y="280" width="230" height="160" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="890" cy="322" r="28" fill="#102F33"/><text x="890" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">4</text><text x="874" y="384" class="cardTitle" text-anchor="start" >硬条件过滤</text><text x="874" y="418" class="small" text-anchor="start" >距离 / 营业 / 可达</text><path d="M1080 360 H1092" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M1082 350 L1094 360 L1082 370" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1110" y="280" width="230" height="160" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="1150" cy="322" r="28" fill="#102F33"/><text x="1150" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">5</text><text x="1134" y="384" class="cardTitle" text-anchor="start" >确定性评分</text><text x="1134" y="418" class="small" text-anchor="start" >五项基础权重</text><path d="M1340 360 H1352" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round"/><path d="M1342 350 L1354 360 L1342 370" fill="none" stroke="#8FC3C0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="1370" y="280" width="360" height="160" rx="28" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><circle cx="1410" cy="322" r="28" fill="#102F33"/><text x="1410" y="330" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="800" fill="#fff" text-anchor="middle">6</text><text x="1394" y="384" class="cardTitle" text-anchor="start" >1 主推 + 2 备选</text><text x="1394" y="418" class="small" text-anchor="start" >理由与行动成本</text><rect x="70" y="500" width="1010" height="250" rx="34" fill="#102F33" stroke="none" /><text x="110" y="550" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="800" fill="#fff">基础评分权重</text><rect x="110" y="590" width="396.00000000000006" height="62" rx="16" fill="#8FC3C0"/><text x="308" y="629" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#102F33" text-anchor="middle">45%</text><text x="308" y="678" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#DDECE9" text-anchor="middle">需求匹配</text><rect x="514" y="590" width="176" height="62" rx="16" fill="#B7D8CE"/><text x="602" y="629" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#102F33" text-anchor="middle">20%</text><text x="602" y="678" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#DDECE9" text-anchor="middle">精力适配</text><rect x="698" y="590" width="132" height="62" rx="16" fill="#F4D8C5"/><text x="764" y="629" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#102F33" text-anchor="middle">15%</text><text x="764" y="678" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#DDECE9" text-anchor="middle">出行成本</text><rect x="838" y="590" width="88" height="62" rx="16" fill="#D8CFE9"/><text x="882" y="629" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#102F33" text-anchor="middle">10%</text><text x="882" y="678" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#DDECE9" text-anchor="middle">社交强度</text><rect x="934" y="590" width="88" height="62" rx="16" fill="#E7DFBF"/><text x="978" y="629" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="800" fill="#102F33" text-anchor="middle">10%</text><text x="978" y="678" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="15" font-weight="700" fill="#DDECE9" text-anchor="middle">预算</text><text x="110" y="724" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="20" fill="#DDECE9">若用户明确指定活动：活动匹配 65% + 基础评分 35%</text><rect x="1110" y="500" width="620" height="250" rx="34" fill="#FFFFFF" stroke="#CEDAD8" filter="url(#softShadow)"/><text x="1150" y="550" class="cardTitle" text-anchor="start" >反馈如何改变推荐？</text><text x="1150" y="600" class="body" text-anchor="start" ><tspan x="1150" dy="0">到访证据 → 满足最小样本量 5</tspan><tspan x="1150" dy="42">→ 质量与新鲜度检查</tspan><tspan x="1150" dy="42">→ 空间画像最多修正 45%</tspan></text><rect x="1150" y="690" width="240" height="48" rx="24" fill="#F4D8C5" stroke="none" /><text x="1270" y="721" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#C4703C">证据只降不升</text><rect x="1410" y="690" width="270" height="48" rx="24" fill="#DDECE9" stroke="none" /><text x="1545" y="721" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#1E6E72">避免少量反馈带偏</text><path d="M1548 750 C1548 850 850 855 850 754" fill="none" stroke="#1E6E72" stroke-width="5" stroke-dasharray="10 12"/><path d="M835 778 l15 -24 15 24" fill="none" stroke="#1E6E72" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="900" y="842" class="label" text-anchor="middle" >新的可信证据回到下一次排序，但不会覆盖硬条件</text></svg>
